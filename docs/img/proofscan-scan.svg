<text y="416.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      </tspan><tspan x="63.3" fill="#56b6c2" xml:space="preserve">server.js:13</tspan><tspan x="150.0" fill="#abb2bf" opacity="0.62" xml:space="preserve">  [proofscan.hardcoded-fallback-secret]</tspan></text>
<text y="434.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      `process.env.JWT_SECRET || '&lt;literal&gt;'` supplies a hardcoded secret whenever JWT_SECRET is</tspan></text>
<text y="453.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      unset in the environment, assigned to `JWT_SECRET`. The literal is committed to the</tspan></text>
<text y="471.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      repository, so it is known to anyone who can read the source. Secret scanners tuned for</tspan></text>
<text y="490.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      issued-credential formats and high entropy do not flag values like this, which is why it</tspan></text>
<text y="508.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      is checked as a pattern rather than by value.</tspan></text>
<text y="527.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      </tspan><tspan x="63.3" fill="#abb2bf" opacity="0.62" xml:space="preserve">code:</tspan><tspan x="99.4" fill="#abb2bf" xml:space="preserve"> process.env.JWT_SECRET || '&lt;redacted: 25 chars&gt;'</tspan></text>
<text y="545.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      </tspan><tspan x="63.3" fill="#abb2bf" opacity="0.62" xml:space="preserve">exploitability:</tspan><tspan x="171.7" fill="#abb2bf" xml:space="preserve"> Requires the deployment to be missing JWT_SECRET. If it is, the</tspan></text>
<text y="564.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      signing key is public: an attacker mints a token for any user id and authenticates as</tspan></text>
<text y="582.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      them, with no credential needed. Verify which environments actually set JWT_SECRET before</tspan></text>
<text y="601.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      downgrading this.</tspan></text>
<text y="619.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      </tspan><tspan x="63.3" fill="#abb2bf" opacity="0.62" xml:space="preserve">status: unverified-flagged  ·  detected by: builtin  ·  CWE-798, CWE-1188</tspan></text>

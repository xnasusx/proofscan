<text y="897.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      </tspan><tspan x="63.3" fill="#56b6c2" xml:space="preserve">server.js:18</tspan><tspan x="150.0" fill="#abb2bf" opacity="0.62" xml:space="preserve">  [proofscan.cors-credentials-reflected-origin]</tspan></text>
<text y="915.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      CORS is configured with `origin: true`, which echoes the request Origin header back,</tspan></text>
<text y="934.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      together with `credentials: true`. Any website a logged-in user visits can then make</tspan></text>
<text y="952.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      credentialed cross-origin requests to this API and read the responses, because the browser</tspan></text>
<text y="971.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      is told that site is an allowed origin. Replace the reflected origin with an explicit</tspan></text>
<text y="989.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      allowlist of the origins the application is actually served from.</tspan></text>
<text y="1008.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      </tspan><tspan x="63.3" fill="#abb2bf" opacity="0.62" xml:space="preserve">code:</tspan><tspan x="99.4" fill="#abb2bf" xml:space="preserve"> cors({ origin: true, credentials: true })</tspan></text>
<text y="1026.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      </tspan><tspan x="63.3" fill="#abb2bf" opacity="0.62" xml:space="preserve">exploitability:</tspan><tspan x="171.7" fill="#abb2bf" xml:space="preserve"> Requires a victim with a live session to visit a page the</tspan></text>
<text y="1045.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      attacker controls. No credential theft and no network position needed: the attacker's page</tspan></text>
<text y="1063.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      issues `fetch(target, {credentials: 'include'})` and reads the authenticated response.</tspan></text>
<text y="1082.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      Cookie-based sessions are directly affected; a session held only in localStorage is not</tspan></text>
<text y="1100.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      reachable this way, so confirm how sessions are carried before rating this in your own</tspan></text>
<text y="1119.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      environment.</tspan></text>

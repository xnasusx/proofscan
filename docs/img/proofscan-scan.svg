<text y="675.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      </tspan><tspan x="63.3" fill="#56b6c2" xml:space="preserve">server.js:14</tspan><tspan x="150.0" fill="#abb2bf" opacity="0.62" xml:space="preserve">  [proofscan.hardcoded-fallback-secret]</tspan></text>
<text y="693.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      `process.env.API_SECRET || '&lt;literal&gt;'` supplies a hardcoded secret whenever API_SECRET is</tspan></text>
<text y="712.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      unset in the environment, assigned to `FAKE_AI_API_KEY`. The literal is committed to the</tspan></text>
<text y="730.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      repository, so it is known to anyone who can read the source. Secret scanners tuned for</tspan></text>
<text y="749.0"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      issued-credential formats and high entropy do not flag values like this, which is why it</tspan></text>
<text y="767.5"><tspan x="20.0" fill="#abb2bf" xml:space="preserve">      is checked as a pattern rather than by value.</tspan></text>

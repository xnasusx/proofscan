rules:
  - id: proofscan.cors-credentials-reflected-origin
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      CORS reflects the caller's Origin while also allowing credentials. In the `cors` package,
      `origin: true` does not mean "allow *" — it echoes back whatever Origin the request carried.
      Combined with `credentials: true`, the browser is told that any site making the request is an
      allowed origin, so any page a logged-in user visits can issue credentialed cross-origin requests
      to this API and read the responses. `Access-Control-Allow-Origin: *` is actually safer here,
      because browsers refuse to combine the wildcard with credentials. Replace the reflected origin
      with an explicit allowlist.
    metadata:
      proofscan_severity: high
      title: CORS reflects any origin while allowing credentials
      cwe:
        - CWE-942
        - CWE-346
      exploitability: >-
        Requires a victim with a live cookie-based session to visit an attacker-controlled page. No
        credential theft or network position needed. Sessions held only in localStorage are not
        reachable this way.
      confidence: HIGH
      category: security
      references:
        - https://cwe.mitre.org/data/definitions/942.html
    patterns:
      - pattern: cors($CONFIG)
      - metavariable-pattern:
          metavariable: $CONFIG
          patterns:
            # Both keys are required, matched independently so key order does not matter.
            - pattern-either:
                - pattern: "{..., origin: true, ...}"
                - pattern: "{..., origin: $REQ.headers.origin, ...}"
                - pattern: "{..., origin: $REQ.header(...), ...}"
            - pattern: "{..., credentials: true, ...}"

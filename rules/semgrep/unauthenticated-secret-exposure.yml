rules:
  - id: proofscan.unauthenticated-secret-exposure
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      This GET route is registered with exactly two arguments — a path and a handler — so no middleware
      runs between them and no authentication or authorisation gate is applied at the route. The handler
      returns a response field whose name indicates credential material. Health and status endpoints
      should return liveness only. Move anything key-derived behind authentication or remove it.
      Truncating the value before returning it still confirms the credential exists, narrows a
      brute-force search, and identifies which key is deployed.
    metadata:
      proofscan_severity: high
      title: Unauthenticated route returns a secret-shaped field
      cwe:
        - CWE-200
        - CWE-215
      exploitability: >-
        No authentication, no session, no user interaction — a single unauthenticated request returns it.
      confidence: MEDIUM
      category: security
      references:
        - https://cwe.mitre.org/data/definitions/200.html
    patterns:
      - pattern: "$RES.json({..., $KEY: $VAL, ...})"
      # The two-argument form is what establishes "unauthenticated": any auth
      # middleware would appear as a third argument between path and handler.
      # Routes that issue credentials are POSTs and so are not matched here,
      # which is why a login endpoint returning `token` is not a false positive.
      - pattern-either:
          - pattern-inside: |
              $APP.get($ROUTE, ($REQ, $RES) => { ... })
          - pattern-inside: |
              $APP.get($ROUTE, async ($REQ, $RES) => { ... })
          - pattern-inside: |
              $APP.get($ROUTE, function ($REQ, $RES) { ... })
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(secret|token|password|passwd|pwd|api_?key|apikey|access_?key|private_?key|credential|salt|passphrase|key).*
      - focus-metavariable: $KEY

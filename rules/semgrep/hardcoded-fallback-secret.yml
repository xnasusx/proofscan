rules:
  - id: proofscan.hardcoded-fallback-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Hardcoded fallback secret: `process.env.$NAME` falls back to a string literal committed to this
      repository. Whenever $NAME is unset in the environment, the application uses the public literal
      instead. Secret scanners tuned for issued-credential formats and high entropy do not flag values
      like this, because the value is not shaped like a real credential — it is simply the value the
      application uses. Remove the fallback and fail closed when the variable is missing.
    metadata:
      proofscan_severity: high
      title: Hardcoded fallback secret
      cwe:
        - CWE-798
        - CWE-1188
      exploitability: >-
        Requires the deployment to be missing the environment variable. Where the fallback is a
        token-signing key, an attacker who reads the repository can mint a token for any user.
      confidence: HIGH
      category: security
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    patterns:
      - pattern-either:
          - pattern: process.env.$NAME || "..."
          - pattern: process.env.$NAME ?? "..."
          - pattern: process.env[$NAME] || "..."
          - pattern: process.env[$NAME] ?? "..."
          - pattern: process.env.get($NAME) || "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(secret|token|password|passwd|pwd|api_?key|apikey|access_?key|private_?key|credential|salt|passphrase|signing|encryption|key).*
      # Placeholders are not usable fallbacks; excluding them keeps the noise down.
      - pattern-not-regex: \|\|\s*["'](|undefined|null|none|false|true|0|1|changeme|todo|tbd)["']
